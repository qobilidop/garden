name: Check survey freshness

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

jobs:
  freshness:
    name: Report overdue literature searches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check registered search cadence
        run: >-
          ./dev.sh python3 scripts/survey/update.py status
          --fail-if-overdue
