name: Site

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "library/**"
      - "notebook/**"
      - "portfolio/**"
      - "brand/**"
      - "cv/**"
      - "site/**"
      - "flake.nix"
      - "flake.lock"
      - "config/nix/flake.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

defaults:
  run:
    # Every step runs in the repo flake shell (flake.nix): the same node,
    # typst, and python a host gets from `nix develop` or direnv.
    shell: nix develop --command bash -e {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Homepage recency is derived from first-add/last-update commits.
          fetch-depth: 0
      # Upstream Nix, as on the hosts (config/nix); not Determinate.
      - uses: cachix/install-nix-action@v31
      # Logo variants, master raster, favicons from brand/ (stdlib only).
      - run: python3 site/scripts/build-brand.py
      # CV PDF from cv/cv.yaml via cv/cv.typ (typst from the flake shell).
      - run: python3 site/scripts/build-cv.py
      - run: npm ci
        working-directory: site
      # Type check (strict tsconfig) and .astro diagnostics; the build alone
      # does not type-check.
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
      # Host: Cloudflare Workers static assets (site/wrangler.jsonc) at
      # qobilidop.com. Token scopes: Account · Workers Scripts · Edit; Zone ·
      # Workers Routes · Edit (qobilidop.com). Roll it in the Cloudflare
      # dashboard if lost. If Actions is down, `npm run deploy` from a host
      # with `wrangler login` publishes the same build.
      - run: npm run deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6629e6b3d096e09e6f0900d4faf33541
