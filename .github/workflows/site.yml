name: Site

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "library/**"
      - "surveys/**"
      - "brand/**"
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/dev:latest
      # Explicit credentials so the pull works even while the package is
      # private (a fresh package after a repo rename starts private).
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Homepage recency is derived from first-add/last-update commits.
          fetch-depth: 0
      - name: Trust the container workspace for Git-backed recency
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Requires typst from the dev image. A push that changes
      # .devcontainer/ races the image republish (dev-image.yml) —
      # if this step fails on a stale image, re-run after it merges.
      - run: python3 site/scripts/build-manuscripts.py
      # Logo variants, master raster, favicons from brand/ (stdlib only).
      - run: python3 site/scripts/build-brand.py
      # CV PDF from cv/cv.yaml via cv/cv.typ (typst, pinned in the dev image).
      - run: python3 site/scripts/build-cv.py
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Host: Cloudflare Workers static assets (site/wrangler.jsonc) at
      # qobilidop.com. Token scopes: Account · Workers Scripts · Edit; Zone ·
      # Workers Routes · Edit (qobilidop.com). Roll it in the Cloudflare
      # dashboard if lost. If Actions is down, `npm run deploy` from a host
      # with `wrangler login` publishes the same build.
      - run: npm run deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6629e6b3d096e09e6f0900d4faf33541
