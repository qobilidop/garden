name: Site

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "library/**"
      - "surveys/**"
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}/dev:latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Homepage recency is derived from first-add/last-update commits.
          fetch-depth: 0
      - name: Trust the container workspace for Git-backed recency
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Requires typst from the dev image. A push that changes
      # .devcontainer/ races the image republish (dev-image.yml) —
      # if this step fails on a stale image, re-run after it merges.
      - run: python3 site/scripts/build-manuscripts.py
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
