# Extends gitleaks' default rules; see hooks/check.sh for how this runs.
# Root-level [[allowlists]] needs gitleaks >= 8.25.0 — older versions
# silently ignore it (this bit CI once; gitleaks.yml pins the version).
[extend]
useDefault = true

# Library notes frontmatter: `citekey: <author><year>-<slug>` lines can cross
# the generic-api-key entropy threshold (first hit: zhang2026-self-harness).
[[allowlists]]
description = "library citekey frontmatter is not a credential"
regexTarget = "line"
regexes = ['''^\s*citekey: [a-z][a-z0-9-]+$''']

# Survey audit logs (absorbed dataflow-selection-enumeration history and
# its record/): Semantic Scholar CorpusId hashes and bibliography seed
# keys are public metadata whose `key:`/`Id:` shapes trip
# generic-api-key. Matched on the token shape, not the file, so real
# credentials in the same files still fire.
[[allowlists]]
description = "citation-graph identifiers and seed citekeys are not credentials"
regexTarget = "match"
regexes = [
  '''CorpusId:[0-9a-f]{40}''',
  '''seed-key:[a-z][a-z0-9]*[0-9]{4}[a-z0-9]*''',
  '''[a-z][a-z0-9]*[0-9]{4}[a-z0-9]*(,[a-z][a-z0-9]*[0-9]{4}[a-z0-9]*)+''',
]
