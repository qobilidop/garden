# Extends gitleaks' default rules; see hooks/check.sh for how this runs.
# Root-level [[allowlists]] needs gitleaks >= 8.25.0 — older versions
# silently ignore it (this bit CI once; gitleaks.yml pins the version).
[extend]
useDefault = true

# Library notes frontmatter: `citekey: <author><year>-<slug>` lines can cross
# the generic-api-key entropy threshold (first hit: zhang2026-self-harness).
[[allowlists]]
description = "library citekey frontmatter is not a credential"
regexTarget = "line"
regexes = ['''^\s*citekey: [a-z][a-z0-9-]+$''']
